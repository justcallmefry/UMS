<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Find Parts For Your Machine — United Motorsports</title>
<style>
  :root{--ink:#1a1a1a;--muted:#6b7280;--line:#e5e7eb;--accent:#1d4ed8;}
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{font-family:system-ui,-apple-system,'Segoe UI',sans-serif;color:var(--ink);background:transparent;}
  #ums-finder{max-width:1100px;margin:0 auto;}
  .ums-bar{background:#f4f4f4;border:1px solid var(--line);border-radius:8px;padding:12px 16px;display:flex;align-items:center;gap:18px;flex-wrap:wrap;}
  .ums-head{display:flex;align-items:center;gap:10px;min-width:190px;}
  .ums-cog{font-size:26px;color:var(--muted);line-height:1;}
  .ums-title{font-size:15px;font-weight:700;letter-spacing:.04em;}
  .ums-title span{font-weight:400;color:var(--muted);}
  .ums-saved{border:0;background:0;padding:2px 0 0;cursor:pointer;color:var(--accent);font-size:13px;font-weight:600;}
  .ums-selects{display:flex;gap:10px;flex-wrap:wrap;flex:1;min-width:0;}
  .ums-selects select{flex:1;min-width:115px;min-height:42px;padding:.45rem .6rem;font-size:14px;border:1px solid #d1d5db;border-radius:6px;background:#fff;color:var(--ink);cursor:pointer;}
  .ums-selects select:disabled{background:#f3f4f6;color:#9ca3af;cursor:not-allowed;}
  .ums-panel{border:1px solid var(--line);border-top:0;border-radius:0 0 8px 8px;background:#fff;padding:12px 16px;}
  .ums-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;margin-top:12px;}
  .ums-card{border:1px solid var(--line);border-radius:8px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;}
  .ums-card:hover{box-shadow:0 2px 10px rgba(0,0,0,.08);}
  .ums-card img{width:100%;aspect-ratio:1;object-fit:cover;background:#f7f7f7;}
  .ums-card .ph{aspect-ratio:1;background:#f7f7f7;}
  .ums-card .nm{font-size:13px;line-height:1.35;padding:8px 10px 4px;flex:1;}
  .ums-card .pr{font-size:14px;font-weight:700;padding:0 10px 10px;}
  .ums-sech{font-size:15px;font-weight:700;margin:16px 0 2px;}
  .ums-sech small{font-weight:400;color:var(--muted);}
  .ums-status{font-size:14px;color:var(--muted);padding:6px 0;}
  .ums-btn{border:1px solid var(--line);background:#fff;border-radius:6px;padding:6px 12px;font-size:13px;cursor:pointer;}
  @media(max-width:560px){.ums-selects select{min-width:0;flex:1 1 45%;}}
</style>
</head>
<body>
<div id="ums-finder">
  <div class="ums-bar">
    <div class="ums-head">
      <span class="ums-cog" aria-hidden="true">&#9881;</span>
      <div>
        <div class="ums-title">FIND PARTS <span>FOR YOUR MACHINE</span></div>
        <button class="ums-saved" id="ums-saved-btn" type="button">Saved Machines &rsaquo;</button>
      </div>
    </div>
    <div class="ums-selects">
      <select id="ums-type"  aria-label="Select type"><option value="">Select Type</option></select>
      <select id="ums-year"  aria-label="Select year"  disabled><option value="">Select Year</option></select>
      <select id="ums-make"  aria-label="Select make"  disabled><option value="">Select Make</option></select>
      <select id="ums-model" aria-label="Select model" disabled><option value="">Select Model</option></select>
    </div>
  </div>
  <div class="ums-panel" id="ums-panel" style="display:none"></div>
</div>

<script>
(function(){
  var CFG = window.UMS_FINDER_CONFIG || {};
  var BASE = (CFG.dataBase || '.').replace(/\/+$/,'');
  var STORE = (CFG.storeBase || 'https://www.unitedmotorsports.com').replace(/\/+$/,'');
  var SAVED_KEY='ums_saved_machines';
  var $=function(id){return document.getElementById(id);};
  var typeEl=$('ums-type'),yearEl=$('ums-year'),makeEl=$('ums-make'),modelEl=$('ums-model'),panel=$('ums-panel'),savedBtn=$('ums-saved-btn');
  var VEHICLES=null,INDEX=null,INDEX_LOADING=null;

  // Report height to a parent frame so an embedding iframe can auto-resize.
  function postHeight(){ try{ var el=document.getElementById('ums-finder'); var h=el?Math.ceil(el.getBoundingClientRect().height):document.documentElement.scrollHeight; parent.postMessage({umsFinderHeight: h}, '*'); }catch(e){} }
  // Navigate the top window via the (privileged) embed snippet when product cards are clicked,
  // since Ecwid renders custom code inside a sandboxed iframe that can block direct top-navigation.
  document.addEventListener('click', function(e){ var a=e.target.closest && e.target.closest('.ums-card'); if(a && a.getAttribute('href')){ try{ parent.postMessage({umsNavigate:a.getAttribute('href')}, '*'); }catch(_){} } });
  if (window.ResizeObserver){ new ResizeObserver(postHeight).observe(document.body); }
  window.addEventListener('load', postHeight);

  fetch(BASE+'/vehicles.json').then(function(r){return r.json();}).then(function(d){
    VEHICLES=d; (d.vehicleTypes||[]).forEach(function(t){ typeEl.insertAdjacentHTML('beforeend','<option value="'+t.code+'">'+t.name+'</option>'); }); postHeight();
  }).catch(function(){ panel.style.display='block'; panel.innerHTML='<div class="ums-status">Could not load vehicle data.</div>'; });

  function loadIndex(){ if(INDEX) return Promise.resolve(INDEX); if(INDEX_LOADING) return INDEX_LOADING;
    INDEX_LOADING=fetch(BASE+'/fitment-index.json').then(function(r){return r.json();}).then(function(d){INDEX=d;return d;}); return INDEX_LOADING; }

  function uniq(a){return a.filter(function(v,i){return a.indexOf(v)===i;});}
  function modelsForType(t){return (VEHICLES.models||[]).filter(function(m){return m.type===t;});}
  function inYear(y){return function(m){return m.yearStart?(y>=m.yearStart&&y<=(m.yearEnd||2026)):true;};}
  function yearsCovered(models){var ys={};models.forEach(function(m){if(m.yearStart){var e=m.yearEnd||2026;for(var y=m.yearStart;y<=e;y++)ys[y]=1;}});return Object.keys(ys).map(Number).sort(function(a,b){return b-a;});}
  function fillSel(el,vals,ph){el.innerHTML='<option value="">'+ph+'</option>'+vals.map(function(v){return '<option value="'+String(v).replace(/"/g,'&quot;')+'">'+v+'</option>';}).join('');}
  function reset(l){if(l<=1){fillSel(yearEl,[],'Select Year');yearEl.disabled=true;}if(l<=2){fillSel(makeEl,[],'Select Make');makeEl.disabled=true;}if(l<=3){fillSel(modelEl,[],'Select Model');modelEl.disabled=true;}}

  typeEl.addEventListener('change',function(){reset(1);panel.style.display='none';if(!typeEl.value)return;fillSel(yearEl,yearsCovered(modelsForType(typeEl.value)),'Select Year');yearEl.disabled=false;postHeight();});
  yearEl.addEventListener('change',function(){reset(2);panel.style.display='none';if(!yearEl.value)return;var y=+yearEl.value;fillSel(makeEl,uniq(modelsForType(typeEl.value).filter(inYear(y)).map(function(m){return m.make;})).sort(),'Select Make');makeEl.disabled=false;});
  makeEl.addEventListener('change',function(){reset(3);panel.style.display='none';if(!makeEl.value)return;var y=+yearEl.value;fillSel(modelEl,uniq(modelsForType(typeEl.value).filter(inYear(y)).filter(function(m){return m.make===makeEl.value;}).map(function(m){return m.model;})).sort(),'Select Model');modelEl.disabled=false;});
  modelEl.addEventListener('change',function(){if(!modelEl.value){panel.style.display='none';return;}runSearch();});

  function clauseFits(c,v){
    if(c.make&&v.make&&c.make.toLowerCase()!==v.make.toLowerCase())return false;
    if(!c.makeLevel&&c.models&&c.models.length&&v.model){var lm=v.model.toLowerCase();if(!c.models.some(function(m){return m.toLowerCase()===lm;}))return false;}
    if(v.year!=null){if(c.yearStart!=null&&v.year<c.yearStart)return false;if(c.yearEnd!=null&&v.year>c.yearEnd)return false;}
    return true;
  }
  function match(v,index){var exact=[],typeMatch=[],universal=[];for(var i=0;i<index.length;i++){var p=index[i];
    if(p.clauses&&p.clauses.length){if(p.clauses.some(function(c){return clauseFits(c,v);}))exact.push(p);continue;}
    if(p.universal){universal.push(p);continue;}
    if(v.type&&p.types&&p.types.indexOf(v.type)>=0)typeMatch.push(p);}
    return {exact:exact,typeMatch:typeMatch,universal:universal};}

  function esc(s){var d=document.createElement('div');d.textContent=s==null?'':s;return d.innerHTML;}
  function card(p){var url=p.url||(STORE+'/products/');return '<a class="ums-card" href="'+esc(url)+'" target="_top">'+(p.image?'<img loading="lazy" src="'+esc(p.image)+'" alt="">':'<div class="ph"></div>')+'<div class="nm">'+esc(p.name)+'</div>'+(p.price?'<div class="pr">$'+esc(p.price)+'</div>':'')+'</a>';}
  function grid(list){return list.length?'<div class="ums-grid">'+list.slice(0,60).map(card).join('')+'</div>':'';}

  function runSearch(){
    var v={type:typeEl.value,year:+yearEl.value,make:makeEl.value,model:modelEl.value};
    panel.style.display='block'; panel.innerHTML='<div class="ums-status">Finding parts for '+v.year+' '+esc(v.make)+' '+esc(v.model)+'&hellip;</div>'; postHeight();
    loadIndex().then(function(idx){
      var r=match(v,idx),label=v.year+' '+v.make+' '+v.model;
      var html='<div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;">'+
        '<div class="ums-sech" style="margin-top:0">'+esc(label)+' &mdash; <span style="color:var(--accent)">'+r.exact.length+' parts fit</span></div>'+
        '<button class="ums-btn" id="ums-save2" type="button">&#9733; Save machine</button></div>';
      html+=r.exact.length?grid(r.exact):'<div class="ums-status">No vehicle-specific parts found for this exact machine yet — try the items below.</div>';
      if(r.typeMatch.length) html+='<div class="ums-sech">Also fits '+esc(v.type)+' <small>('+r.typeMatch.length+')</small></div>'+grid(r.typeMatch);
      if(r.universal.length) html+='<div class="ums-sech">Universal <small>('+r.universal.length+')</small></div>'+grid(r.universal);
      panel.innerHTML=html; postHeight();
      var sb=$('ums-save2'); if(sb) sb.onclick=function(){saveMachine(v,label);sb.textContent='✓ Saved';};
    });
  }

  function getSaved(){try{return JSON.parse(localStorage.getItem(SAVED_KEY)||'[]');}catch(e){return[];}}
  function setSaved(l){try{localStorage.setItem(SAVED_KEY,JSON.stringify(l));}catch(e){}}
  function saveMachine(v,label){var l=getSaved();if(!l.some(function(x){return x.label===label;})){l.unshift({type:v.type,year:v.year,make:v.make,model:v.model,label:label});setSaved(l);}}
  savedBtn.addEventListener('click',function(){var l=getSaved();panel.style.display='block';
    panel.innerHTML='<div class="ums-sech" style="margin-top:0">Saved machines</div>'+(l.length?l.map(function(m,i){return '<div data-i="'+i+'" class="ums-saved-row" style="display:flex;justify-content:space-between;padding:8px 0;border-top:'+(i?'1px solid var(--line)':'0')+';cursor:pointer;font-size:14px;"><span>&#128757; '+esc(m.label)+'</span><span class="ums-del" data-i="'+i+'" style="color:var(--muted);padding:0 6px;">&times;</span></div>';}).join(''):'<div class="ums-status">No saved machines yet. Find your machine, then "Save machine".</div>');
    panel.querySelectorAll('.ums-saved-row').forEach(function(row){row.addEventListener('click',function(e){
      if(e.target.classList.contains('ums-del')){var l2=getSaved();l2.splice(+e.target.getAttribute('data-i'),1);setSaved(l2);savedBtn.click();return;}
      var m=getSaved()[+row.getAttribute('data-i')];
      typeEl.value=m.type;typeEl.dispatchEvent(new Event('change'));yearEl.value=m.year;yearEl.dispatchEvent(new Event('change'));makeEl.value=m.make;makeEl.dispatchEvent(new Event('change'));modelEl.value=m.model;modelEl.dispatchEvent(new Event('change'));}); });
    postHeight();
  });
})();
</script>
</body>
</html>
